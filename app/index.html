<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>銀行別 机上評価</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--pri:#1f3a5f;--onpri:#fff;--line:#dde3ea;--neg:#c0392b;--ok:#1e7a46;--okbg:#e3f3ea;--ngbg:#fbe7e4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--ink:#e6ebf1;--mut:#93a0b0;--pri:#7fb0ee;--onpri:#12161c;--line:#2c3643;--neg:#ff7b6b;--ok:#6fd49a;--okbg:#18362a;--ngbg:#402320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--ink:#e6ebf1;--mut:#93a0b0;--pri:#7fb0ee;--onpri:#12161c;--line:#2c3643;--neg:#ff7b6b;--ok:#6fd49a;--okbg:#18362a;--ngbg:#402320;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:160px}
button,select,input,textarea{font:inherit}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button.pri,button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{padding:8px 14px;font-weight:600}
nav{display:flex;gap:4px;padding-top:10px;overflow-x:auto}
nav button{border-radius:8px 8px 0 0;white-space:nowrap}
main{padding-block:16px;max-width:980px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut)}
.card h2.sub{margin-top:14px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
label span{color:var(--mut);font-size:13px}
input[type=checkbox]{width:auto;max-width:none;accent-color:var(--pri)}
input,select{width:150px;max-width:55%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}
select{text-align:left}input.wide{width:60%;max-width:none;text-align:left}
textarea{width:100%;height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px monospace}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;color:var(--mut)}th{font-weight:600}
td.nm{color:var(--ink)}
.neg{color:var(--neg)}.big{font-weight:700;font-size:16px}.sc{overflow-x:auto}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok)}
.pill.ng{background:var(--ngbg);color:var(--neg)}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:13px}
.err{color:var(--neg);font-size:13px}
</style></head><body>
<header><h1>AXIA 銀行別 机上評価</h1>
<span id="sync" class="note" style="margin:0">端末内のみ保存</span><div class="acts"><button onclick="addNew()">＋新規</button><button onclick="dup()">複製</button><button onclick="del()">削除</button><button onclick="dataPanel()">データ</button></div></header>
<div class="tools" id="tools"></div>
<nav id="tabs"></nav>
<main id="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="logo.js"></script><script src="template.js"></script><script src="seed.js"></script><script src="seed2.js"></script><script src="iontables.js"></script><script src="calc.js"></script><script src="calc2.js"></script>
<script>
const KEY='axia-v2',OLD='axia-sim-v1';
const TOOLS={sim:'楽天銀行',ion:'イオン銀行',sbj:'SBJ銀行'};
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.lists){
  let old=null;try{old=JSON.parse(localStorage.getItem(OLD))}catch(e){}
  const mk=(a,pre)=>a.map((p,i)=>({...p,id:pre+i}));
  S={tool:'sim',cur:{sim:'list',ion:'list',sbj:'list'},lists:{
    sim:old&&old.list&&old.list.length?old.list:mk(window.SEED,'s'),ion:mk(window.SEED_ION,'i'),sbj:mk(window.SEED_SBJ,'b')}};
}
let SYNC={col:null,last:{},timer:null,busy:false};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}schedSync()};
const L=()=>S.lists[S.tool],cur=()=>S.cur[S.tool];
const getP=()=>L().find(p=>p.id===cur());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=n=>(n===''||n==null||isNaN(n))?'':Math.round(n).toLocaleString('ja-JP');
const D=(n,d=0)=>(n===''||n==null||isNaN(n))?'':Number(n).toLocaleString('ja-JP',{maximumFractionDigits:d,minimumFractionDigits:d});
const PCT=(n,d=2)=>(n===''||n==null||!isFinite(n))?'':D(n*100,d)+'%';
const cls=n=>n<0?'neg':'';
const pill=(ok,a,b)=>`<span class="pill ${ok?'':'ng'}">${ok?a:b}</span>`;

/* ---- 入力項目の定義 ---- */
const N='num',T='text',DT='date',SEL='sel',PC='pct';
const AREAS={'東京':['青エリア','赤エリア','黄エリア','緑エリア'],'大阪':['青エリア','赤エリア'],'神戸・福岡':['赤エリア'],'京都・名古屋':['赤エリア']};
const SCHEMA={
 sim:[
  ['物件情報',[['name','物件名',T],['room','号室',T],['vendor','業者目線（円）',N],['prop','プロップ評価額（円）',N],['base','基準収支（円/月）',N],['date','築年月日',DT]]],
  ['条件①　賃料・費用',[['mode','形態',SEL,['サブリース','集金代行']],['rent','賃料（円/月）',N],['mgmt','管理費',N],['repair','修繕費',N],['other','その他費用',N]]],
  ['条件②　融資',[['rate','金利（％）',PC],['years','融資年数',N]]],
  ['楽天評価シートの出力項目',[['addr','住居表示',T],['station','最寄駅/徒歩（路線 / 駅 徒歩○分）',T],['station2','最寄駅/徒歩（2つ目）',T],['sqm','専有面積（㎡）',N],['floorsTotal','総階数',N],['floor','所在階',N],['layout','間取り',T],['outCol','出力する販売価格',SEL,['①','②','③']],['priceOv','販売希望価格を手入力（万円）',N]]],
  ['マイソク（販売図面）の項目',[['units','総戸数',N],['structure','構造',T],['land','土地権利',T],['mgmtCo','建物管理会社',T],['mgmtType','管理形態',T],['mgmtMethod','管理方式',T],['guarantee','保証家賃（家賃表示＝保証家賃÷0.9）',N],['remarks','備考',T],['tradeType','取引態様',SEL,['（未選択）','売主','媒介','代理']],['showInternal','オーナー収支・幅を図面に',SEL,['載せない','載せる']]]]],
 ion:[
  ['物件情報',[['name','物件名',T],['region','地域',SEL,Object.keys(AREAS)],['area','エリア',SEL,p=>AREAS[p.region]||[]],['walk','徒歩',SEL,['5分以内','6分以上']],['sqm','平米数',N],['built','築年月日',DT],['units','総戸数',N],['cost','仕入れ価格（円）',N]]],
  ['賃料・費用',[['sub','サブリース賃料',N],['shu','集金代行（実賃）',N],['mgmt','管理費',N],['repair','修繕費',N],['other','その他',N]]],
  ['融資条件',[['price','販売価格（空欄で自動計算）',N],['deposit','手付金',N],['feeRate','諸費用率（％）',PC],['y1','融資年数①',N],['y2','融資年数②',N],['r1','金利 ①年（％）',PC],['r2','金利 ①年＋諸（％）',PC],['r3','金利 ②年（％）',PC],['r4','金利 ②年＋諸（％）',PC]]],
  ['手入力で上書き（空欄なら自動）',[['yieldOv','想定利回り（％）',N],['costOv','諸費用（円）',N],['agentOv','代行手数料（円）',N],['rentBasis','賃料の基準',SEL,['標準','中央値換算']],['feeMode','代行手数料の方式',SEL,['標準','賃料×10%']]]]],
 sbj:[
  ['物件情報',[['name','物件名',T],['region','エリア',SEL,['東京','東京以外']],['sqm','平米数',N],['built','築年月日',DT],['units','総戸数',N],['maisoku','マイソク価格（業者目線）',N],['tas','TAS',N]]],
  ['賃料・費用',[['sub','サブリース賃料',N],['shu','集金代行（実賃）',N],['mgmtFee','管理手数料',N],['mgmt','管理費',N],['repair','修繕費',N]]],
  ['融資条件',[['rate','金利（％）',PC],['yield','基準利回り（％）',PC],['offset','仕入れ上限＝評価−（円）',N]]]]
};
const NEWP={sim:{units:'',structure:'鉄筋コンクリート造',land:'所有権',mgmtCo:'',mgmtType:'全部委託',mgmtMethod:'巡回',guarantee:'',remarks:'',tradeType:'（未選択）',showInternal:'載せない',addr:'',station:'',station2:'',sqm:'',floorsTotal:'',floor:'',layout:'',outCol:'①',priceOv:'',name:'新規物件',room:'',vendor:'',prop:'',base:30000,mode:'サブリース',rent:0,mgmt:0,repair:0,other:0,rate:0.02748,years:35,date:''},
 ion:{name:'新規物件',region:'東京',area:'赤エリア',walk:'5分以内',sqm:'',built:'',units:'',cost:'',sub:'',shu:'',mgmt:'',repair:'',other:0,price:'',deposit:0,feeRate:0.05,y1:35,y2:45,r1:0.02376,r2:0.0228,r3:0.02532,r4:0.02532,rentBasis:'標準',feeMode:'標準',yieldOv:'',costOv:'',agentOv:''},
 sbj:{name:'新規物件',region:'東京以外',sqm:'',built:'',units:'',maisoku:'',tas:'',sub:'',shu:'',mgmtFee:'',mgmt:'',repair:'',rate:0.0235,yield:0.04,offset:4000000}};

/* ---- 画面 ---- */
function head(){
  document.getElementById('tools').innerHTML=Object.keys(TOOLS).map(k=>`<button class="${S.tool===k?'on':''}" onclick="setTool('${k}')">${TOOLS[k]}</button>`).join('');
  document.getElementById('tabs').innerHTML=`<button class="${cur()==='list'?'on':''}" onclick="go('list')">一覧</button>`+
   L().map(p=>`<button class="${cur()===p.id?'on':''}" data-id="${p.id}" onclick="go('${p.id}')">${esc(p.name||'(無題)')}</button>`).join('')}
function setTool(t){S.tool=t;save();render()}
function go(id){S.cur[S.tool]=id;save();render()}
function render(){head();(cur()==='list'||!getP())?renderList():renderProp();save()}
function fieldHTML(p,f){const[k,l,t,o]=f;const v=p[k]??'';
  if(t===SEL){const opts=typeof o==='function'?o(p):o;return `<label><span>${l}</span><select data-k="${k}">${opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
  if(t===T)return `<label><span>${l}</span><input class="wide" data-k="${k}" value="${esc(v)}"></label>`;
  if(t===PC)return `<label><span>${l}</span><input type="number" inputmode="decimal" step="any" data-k="${k}" data-pct="1" value="${v===''?'':+(Number(v)*100).toFixed(8)}"></label>`;
  if(t===DT)return `<label><span>${l}</span><input type="date" data-k="${k}" value="${esc(v)}"></label>`;
  return `<label><span>${l}</span><input type="number" inputmode="decimal" step="any" data-k="${k}" value="${esc(v)}"></label>`}
function renderProp(){const p=getP();const g=SCHEMA[S.tool];
  const cards=g.map(([title,fs],i)=>`<div class="card"><h2>${title}</h2>${fs.map(f=>fieldHTML(p,f)).join('')}</div>`).join('');
  document.getElementById('main').innerHTML=`<div class="card" id="mscard" style="margin-bottom:16px"><h2>マイソクから自動入力</h2><div class="bar" style="margin:0"><button class="pri" onclick="document.getElementById('msf').click()">マイソクを選択（PDF・写真）</button>${S.tool==='sim'?'<button onclick="mkOpen()">マイソクを作成</button>':''}<input type="file" id="msf" accept="application/pdf,image/*" hidden><button onclick="msTextToggle()">ネットの情報を貼り付け</button><span id="mss" class="note" style="margin:0"></span></div><div id="mst" hidden style="margin-top:10px"><textarea id="msx" placeholder="不動産サイトの物件情報（物件名、所在地、駅、築年月、面積など）をコピーして、ここに貼り付けてください" style="height:140px"></textarea><div class="bar"><button class="pri" onclick="msReadText()">この文章から読み取る</button></div></div><div id="msr"></div></div><div class="grid">${cards}</div><div class="card sc" style="margin-top:16px"><h2>計算結果</h2><div id="res"></div></div>`;
  document.querySelectorAll('[data-k]').forEach(e=>e.addEventListener('change',()=>{ if(e.tagName==='SELECT'){p[e.dataset.k]=e.value;if(e.dataset.k==='region'&&S.tool==='ion'){p.area=(AREAS[p.region]||[''])[0];}renderProp();head();save();} }));
  document.querySelectorAll('[data-k]').forEach(e=>{if(e.tagName==='INPUT')e.addEventListener('input',()=>{p[e.dataset.k]=e.type==='number'&&e.value!==''?(e.dataset.pct?Number(e.value)/100:Number(e.value)):e.value;
    if(e.dataset.k==='name'){const b=document.querySelector(`#tabs [data-id="${p.id}"]`);if(b)b.textContent=p.name||'(無題)'}upd();save()})});
  document.getElementById('msf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)msRead(f)};
  upd()}
function upd(){const p=getP();if(!p)return;document.getElementById('res').innerHTML=RES[S.tool](p)}

const RES={
 sim(p){const r=AxiaCalc.calc(p);
  const row=(l,f,c)=>`<tr><td>${l}</td>${r.cols.map(x=>`<td class="${c?cls(x[c]):''}">${f(x)}</td>`).join('')}</tr>`;
  const a=AxiaCalc.age(p.date);
  return `<table><thead><tr><th></th><th>①</th><th>②</th><th>③</th></tr></thead><tbody>`+
   row('収支',x=>F(x.income),'income')+row('ローン月返済',x=>F(x.loan))+row('販売金額（万円）',x=>`<span class="big">${F(x.price)}</span>`)+row('実質収支',x=>F(x.real),'real')+row('プロップ倍率',x=>D(x.mult,2))+row('幅（万円）',x=>F(x.width),'width')+
   `</tbody></table>${rkNote(p)}<div class="note">賃管手数料 ${F(r.G3)}円　費用合計 ${F(r.H3)}円　販売①−750万円：${F(r.c3)}円${p.date?'　築年数：'+a+(a==='新築'?'':'日'):''}</div>`},
 ion(p){const o=AxiaCalc2.ion(p);const y=o.y;
  let h=`<div class="bar" style="margin:0 0 8px">${pill(o.ok,'融資条件に該当','融資条件に該当しない')}<span class="note" style="margin:0">20㎡以上・築25年未満・20戸以上</span></div>`;
  h+=`<table><tbody><tr><td>築年数</td><td>${o.years==null?'':o.years+'年（'+F(o.days)+'日）'}</td></tr>`+
     `<tr><td>想定利回り</td><td>${y.rate?D(y.pct,2)+'%':`<span class="err">${esc(y.err||'')}　→「想定利回り」を手入力</span>`}</td></tr>`+
     `<tr><td>賃料（手取計算用）</td><td>${F(o.rent)}</td></tr><tr><td>手数料合計</td><td>${F(o.feeTotal)}（代行${F(o.agent)}＋管積${F(o.kanseki)}）</td></tr>`+
     `<tr><td>販売価格</td><td><span class="big">${o.price==null?'—':F(o.price)}</span></td></tr>`;
  if(o.price!=null)h+=`<tr><td>表面利回り / NET</td><td>${PCT(o.gross)} / ${PCT(o.net)}</td></tr><tr><td>物件幅（販売−仕入）</td><td>${F(o.width)}</td></tr><tr><td>融資金額 / 諸費用</td><td>${F(o.loan)} / ${F(o.cost)}</td></tr>`;
  h+=`</tbody></table>`;
  if(o.plans)h+=`<table style="margin-top:12px"><thead><tr><th>プラン</th><th>ローン金額</th><th>金利</th><th>収支</th></tr></thead><tbody>${o.plans.map(x=>`<tr><td>${x.label}</td><td>${F(x.amount)}</td><td>${PCT(x.rate,3)}</td><td class="${cls(x.income)}">${F(x.income)}</td></tr>`).join('')}</tbody></table>`;
  return h},
 sbj(p){const r=AxiaCalc2.sbj(p);
  const d=r.days;
  return `<div class="bar" style="margin:0 0 8px">${pill(r.ok,'100%融資の対象','90%融資')}<span class="note" style="margin:0">20㎡以上・築25年未満・20戸以上で100%</span></div>
  <table><tbody>
   <tr><td>築年数</td><td>${d==null?'':D(d/365,1)+'年（'+F(d)+'日）'}</td></tr>
   <tr><td>評価額</td><td>${F(r.base)}</td></tr>
   <tr><td>販売金額</td><td><span class="big">${F(r.sale)}</span></td></tr>
   <tr><td>仕入れ上限目安</td><td>${F(r.limit)}</td></tr>
   <tr><td>物件幅（評価−マイソク）</td><td>${F(r.width)}</td></tr>
   <tr><td>TAS倍率</td><td>${D(r.tas,3)}</td></tr>
   <tr><td>表面利回り（販売金額ベース）</td><td>${PCT(r.yieldSale)}</td></tr>
   <tr><td>手取賃料</td><td>${F(r.tegaki)}</td></tr>
   <tr><td>返済額（35年）</td><td>${F(r.repay)}</td></tr>
   <tr><td>収支</td><td class="${cls(r.income)}"><span class="big">${F(r.income)}</span></td></tr></tbody></table>
  <div class="note">利回り評価：100%＝${F(r.B18)}、90%＝${F(r.D18)}　TAS上限：×1.3＝${F(r.B23)}、×1.4＝${F(r.D23)}</div>`}
};

function renderList(){let h='';
 if(S.tool==='sim'){h=`<table><thead><tr><th><input type="checkbox" id="ckall" aria-label="すべて選択"></th><th>物件名</th><th>金利</th><th>プロップ額</th><th>融資①</th><th>融資②</th><th>①収支</th><th>②収支</th><th>③収支</th></tr></thead><tbody>`+
  L().map(p=>{const r=AxiaCalc.calc(p),pr=Number(p.prop)||0;return `<tr onclick="go('${p.id}')" style="cursor:pointer"><td onclick="event.stopPropagation()"><input type="checkbox" class="ck" value="${p.id}" aria-label="選択"></td><td class="nm">${esc(p.name)}</td><td>${D((Number(p.rate)||0)*100,3)}%</td><td>${pr?F(pr):''}</td><td>${pr?F(pr*1.25):''}</td><td>${pr?F(pr*1.5):''}</td>${r.cols.map(c=>`<td class="${cls(c.real)}">${F(c.real)}</td>`).join('')}</tr>`}).join('')+
  `</tbody></table><div class="note">※融資①＝プロップ額×1.25倍、融資②＝プロップ額×1.5倍。収支は実質収支。行をタップで物件へ。</div>`}

async function msBlobs(file,max){
  const cv=document.createElement('canvas'),out=[];
  const draw=async(src,w,h)=>{const k=Math.min(1,1800/Math.max(w,h));cv.width=Math.round(w*k);cv.height=Math.round(h*k);const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);await src(c,k);return new Promise(r=>cv.toBlob(r,'image/jpeg',0.88))};
  if(file.type==='application/pdf'){
    if(typeof pdfjsLib==='undefined')throw {code:'nopdf'};
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")'],{type:'text/javascript'}));
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    for(let i=1;i<=Math.min(pdf.numPages,max,2);i++){const pg=await pdf.getPage(i);const v=pg.getViewport({scale:1});const k=1800/Math.max(v.width,v.height);
      out.push(await draw(async c=>{await pg.render({canvasContext:c,viewport:pg.getViewport({scale:k})}).promise},v.width*k,v.height*k))}
  }else{const bmp=await createImageBitmap(file);out.push(await draw(async(c,k)=>c.drawImage(bmp,0,0,bmp.width*k,bmp.height*k),bmp.width,bmp.height))}
  return out}
async function msRead(file){

  if(!sample){st.textContent='この機能は公開版のページでのみ使えます';return}
  try{
    const lim=await sample.limits().catch(()=>null);
    if(!lim||!lim.images){st.textContent='この環境では画像の読み取りを使えません';return}
    st.textContent='読み取り中…（初回は許可の確認が出ます）';
    const blobs=await msBlobs(file,lim.images.maxCount||2);
    const E=await sample.json(MS_PROMPT,{images:blobs,modelTier:'default'});
    st.textContent='読み取りました。内容を確認してください';msShow(E)
  }catch(e){st.textContent=e&&e.code==='nopdf'?'PDFを開けませんでした。写真かスクショで試してください':e&&e.code==='not_granted'?'許可されなかったため読み取りません':e&&e.code==='rate_limited'?'短時間に多く使いました。少し待ってください':'読み取れませんでした。画像を変えて試してください'}}

/* ---- 端末をまたぐ同期（本人専用のデータベース。使えない環境では端末内のみ） ---- */
const setSync=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
function allDocs(){const o={};for(const t of Object.keys(S.lists))S.lists[t].forEach((p,i)=>{o[p.id]=JSON.parse(JSON.stringify({...p,tool:t,order:i}))});return o}
function schedSync(){if(!SYNC.col)return;const cur=allDocs();
  const same=Object.keys(cur).length===Object.keys(SYNC.last).length&&Object.keys(cur).every(id=>SYNC.last[id]===stable(cur[id]));
  if(same)return;clearTimeout(SYNC.timer);setSync('保存中…');SYNC.timer=setTimeout(flush,700)}
async function flush(){SYNC.timer=null;if(!SYNC.col)return;if(SYNC.busy){SYNC.timer=setTimeout(flush,500);return}
  SYNC.busy=true;
  try{const cur=allDocs();
    for(const id in cur){const js=stable(cur[id]);if(SYNC.last[id]!==js){await SYNC.col.doc(id).set(cur[id]);SYNC.last[id]=js}}
    for(const id of Object.keys(SYNC.last)){if(!cur[id]){await SYNC.col.doc(id).delete();for(const sl of ['photo','plan','map'])SYNC.col.doc('img_'+id+'_'+sl).delete().catch(()=>{});delete SYNC.last[id]}}
    setSync('同期済み')}
  catch(e){setSync('同期エラー（この端末には保存済み）')}
  SYNC.busy=false}
function applyRemote(docs){
  const lists={sim:[],ion:[],sbj:[]};
  docs.forEach(d=>{if(d.id.startsWith('img_'))return;const x={...d.data()};const t=x.tool;if(!lists[t])return;lists[t].push({...x,id:d.id})});
  for(const t in lists)lists[t].sort((a,b)=>(a.order||0)-(b.order||0)).forEach(p=>{delete p.tool;delete p.order});
  const rem={};docs.forEach(d=>{rem[d.id]=stable(d.data())});
  SYNC.last=rem;
  try{localStorage.setItem('axia-v2-backup',JSON.stringify(S.lists))}catch(e){}
  S.lists=lists;
  for(const t in S.cur)if(S.cur[t]!=='list'&&!lists[t].find(p=>p.id===S.cur[t]))S.cur[t]='list';
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  const a=document.activeElement;if(cur()==='list'||!a||a.tagName!=='INPUT')render();else head()}
async function startSync(){
  try{
    const user=await claude.use('user'),db=await claude.use('db');
    const uid=user&&await user.id();
    if(!db||!uid){setSync('端末内のみ保存（共有保存を利用できません）');return}
    const col=db.collection('data/users/'+uid);
    let first=true;const t=setTimeout(()=>setSync('接続中…（端末内のデータを表示中）'),10000);
    col.onSnapshot(async snap=>{
      if(snap.metadata.fromCache&&first&&snap.empty)return;
      clearTimeout(t);
      snap.docs.forEach(d=>{if(d.id.startsWith('img_')&&d.exists)IMG[d.id.slice(4)]=d.data().data});
      const docs=snap.docs.filter(d=>d.id!=='_meta'&&!d.id.startsWith('img_')&&d.exists);
      const hasMeta=snap.docs.some(d=>d.id==='_meta');
      if(first){first=false;
        if(!hasMeta&&!docs.length){await col.doc('_meta').set({v:1});SYNC.col=col;SYNC.last={};await flush();return}
        SYNC.col=col;applyRemote(docs);setSync('同期済み');return}
      if(SYNC.timer||SYNC.busy)return;
      const rem={};docs.forEach(d=>{rem[d.id]=stable(d.data())});
      const same=Object.keys(rem).length===Object.keys(SYNC.last).length&&Object.keys(rem).every(id=>SYNC.last[id]===rem[id]);
      if(!same){applyRemote(docs);setSync('同期済み')}
    },()=>setSync('同期エラー（この端末には保存済み）'));
  }catch(e){setSync('端末内のみ保存')}}
render();
startSync();
