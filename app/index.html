<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>銀行別 机上評価</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--pri:#1f3a5f;--onpri:#fff;--line:#dde3ea;--neg:#c0392b;--ok:#1e7a46;--okbg:#e3f3ea;--ngbg:#fbe7e4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--ink:#e6ebf1;--mut:#93a0b0;--pri:#7fb0ee;--onpri:#12161c;--line:#2c3643;--neg:#ff7b6b;--ok:#6fd49a;--okbg:#18362a;--ngbg:#402320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--ink:#e6ebf1;--mut:#93a0b0;--pri:#7fb0ee;--onpri:#12161c;--line:#2c3643;--neg:#ff7b6b;--ok:#6fd49a;--okbg:#18362a;--ngbg:#402320;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:160px}
button,select,input,textarea{font:inherit}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button.pri,button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{padding:8px 14px;font-weight:600}
nav{display:flex;gap:4px;padding-top:10px;overflow-x:auto}
nav button{border-radius:8px 8px 0 0;white-space:nowrap}
main{padding-block:16px;max-width:980px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut)}
.card h2.sub{margin-top:14px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
label span{color:var(--mut);font-size:13px}
input[type=checkbox]{width:auto;max-width:none;accent-color:var(--pri)}
input,select{width:150px;max-width:55%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}
select{text-align:left}input.wide{width:60%;max-width:none;text-align:left}
textarea{width:100%;height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px monospace}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;color:var(--mut)}th{font-weight:600}
td.nm{color:var(--ink)}
.neg{color:var(--neg)}.big{font-weight:700;font-size:16px}.sc{overflow-x:auto}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok)}
.pill.ng{background:var(--ngbg);color:var(--neg)}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:13px}
.err{color:var(--neg);font-size:13px}
</style></head><body>
<header><h1>AXIA 銀行別 机上評価</h1>
<span id="sync" class="note" style="margin:0">端末内のみ保存</span><div class="acts"><button onclick="addNew()">＋新規</button><button onclick="dup()">複製</button><button onclick="del()">削除</button><button onclick="bulkOpen()">一括読み取り</button><button onclick="dataPanel()">データ</button></div></header>
<div class="tools" id="tools"></div>
<nav id="tabs"></nav>
<main id="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="logo.js"></script><script src="template.js"></script><script src="areas.js"></script><script src="seed.js"></script><script src="seed2.js"></script><script src="iontables.js"></script><script src="calc.js"></script><script src="calc2.js"></script>
<script>
const KEY='axia-v2',OLD='axia-sim-v1';
const TOOLS={sim:'楽天銀行',ion:'イオン銀行',sbj:'SBJ銀行'};
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.lists){
  let old=null;try{old=JSON.parse(localStorage.getItem(OLD))}catch(e){}
  const mk=(a,pre)=>a.map((p,i)=>({...p,id:pre+i}));
  S={tool:'sim',cur:{sim:'list',ion:'list',sbj:'list'},lists:{
    sim:old&&old.list&&old.list.length?old.list:mk(window.SEED,'s'),ion:mk(window.SEED_ION,'i'),sbj:mk(window.SEED_SBJ,'b')}};
}
let SYNC={col:null,last:{},timer:null,busy:false};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}schedSync()};
const L=()=>S.lists[S.tool],cur=()=>S.cur[S.tool];
const getP=()=>L().find(p=>p.id===cur());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=n=>(n===''||n==null||isNaN(n))?'':(Math.round(n)+0).toLocaleString('ja-JP');
const D=(n,d=0)=>(n===''||n==null||isNaN(n))?'':(Number(n)+0).toLocaleString('ja-JP',{maximumFractionDigits:d,minimumFractionDigits:d});
const PCT=(n,d=2)=>(n===''||n==null||!isFinite(n))?'':D(n*100,d)+'%';
const cls=n=>n<0?'neg':'';
const pill=(ok,a,b)=>`<span class="pill ${ok?'':'ng'}">${ok?a:b}</span>`;

/* ---- 入力項目の定義 ---- */
const N='num',T='text',DT='date',SEL='sel',PC='pct';
const nkSt=v=>String(v||'').replace(/[\s　()（）・]/g,'').replace(/駅$/,'').replace(/ケ/g,'ヶ').replace(/ｹ/g,'ヶ');
function ionAreaOf(p){const k=nkSt(p.ekimei);if(!k)return {};
  const my=(S.stArea||{})[k];if(my)return {area:my,src:'メモ'};
  if(p.region!=='東京')return {err:'東京以外は地図から判定できません。エリアを選んでください'};
  const c=(window.ION_AREA_MAP||{})[k];if(c)return {area:c+'エリア',src:'地図'};
  return {err:'地図データに該当する駅がありません（赤羽・大崎・練馬など、地図で色が分かれる駅も含む）。エリアを選んでください'}}
function ionAutoArea(p){const r=ionAreaOf(p);if(r.area&&(AREAS[p.region]||[]).includes(r.area))p.area=r.area;return r}
const UNSEL='（未選択）',unsel=v=>v===UNSEL||v==null?'':v;
const STRUCTS=[UNSEL,'鉄筋コンクリート造','鉄骨鉄筋コンクリート造','鉄骨コンクリート造'],METHODS=[UNSEL,'巡回','日勤','常駐'],
 LAYOUTS=[UNSEL,'1R','1K','1DK','1LDK','2K','2DK','2LDK','3DK','3LDK'];
const normLayout=v=>{const x=String(v||'').toUpperCase().replace(/[\s　]/g,'').replace(/ワンルーム/,'1R');return LAYOUTS.includes(x)?x:''};
const AREAS={'東京':['青エリア','赤エリア','黄エリア','緑エリア'],'大阪':['青エリア','赤エリア'],'神戸・福岡':['赤エリア'],'京都・名古屋':['赤エリア']};
const SCHEMA={
 sim:[
  ['物件情報',[['name','物件名',T],['room','号室',T],['vendor','業者目線（円）',N],['prop','プロップ評価額（円）',N],['base','基準収支（円/月）',N],['date','築年月日',DT]]],
  ['条件①　賃料・費用',[['mode','形態',SEL,['サブリース','集金代行']],['rent','賃料（円/月）',N],['mgmt','管理費',N],['repair','修繕費',N],['other','その他費用',N]]],
  ['条件②　融資',[['rate','金利（％）',PC],['years','融資年数',N]]],
  ['楽天評価シートの出力項目',[['addr','住居表示',T],['station','最寄駅/徒歩（路線 / 駅 徒歩○分）',T],['station2','最寄駅/徒歩（2つ目）',T],['sqm','専有面積（㎡）',N],['floorsTotal','総階数',N],['floor','所在階',N],['layout','間取り',SEL,LAYOUTS],['outCol','出力する販売価格',SEL,['①','②','③']],['priceOv','販売希望価格を手入力（万円）',N]]],
  ['マイソク（販売図面）の項目',[['units','総戸数',N],['structure','構造',SEL,STRUCTS],['mgmtCo','建物管理会社',T],['mgmtMethod','管理方式',SEL,METHODS],['guarantee','保証家賃（家賃表示＝保証家賃÷0.9）',N],['remarks','備考',T],['tradeType','取引態様',SEL,['（未選択）','売主','媒介','代理']],['showInternal','オーナー収支・幅を図面に',SEL,['載せない','載せる']]]]],
 ion:[
  ['物件情報',[['name','物件名',T],['region','地域',SEL,Object.keys(AREAS)],['ekimei','最寄駅名（東京は地図の色でエリアを自動設定）',T],['area','エリア',SEL,p=>AREAS[p.region]||[]],['walk','徒歩',SEL,['5分以内','6分以上']],['sqm','平米数',N],['built','築年月日',DT],['units','総戸数',N],['cost','仕入れ価格（円）',N]]],
  ['賃料・費用',[['sub','サブリース賃料',N],['shu','集金代行（実賃）',N],['mgmt','管理費',N],['repair','修繕費',N],['other','その他',N]]],
  ['融資条件',[['price','販売価格（空欄で自動計算）',N],['deposit','手付金',N],['feeRate','諸費用率（％）',PC],['y1','融資年数①',N],['y2','融資年数②',N],['r1','金利 ①年（％）',PC],['r2','金利 ①年＋諸（％）',PC],['r3','金利 ②年（％）',PC],['r4','金利 ②年＋諸（％）',PC]]],
  ['手入力で上書き（空欄なら自動）',[['yieldOv','想定利回り（％）',N],['costOv','諸費用（円）',N],['agentOv','代行手数料（円）',N],['rentBasis','賃料の基準',SEL,['標準','中央値換算']],['feeMode','代行手数料の方式',SEL,['標準','賃料×10%']]]]],
 sbj:[
  ['物件情報',[['name','物件名',T],['region','エリア',SEL,['東京','東京以外']],['sqm','平米数',N],['built','築年月日',DT],['units','総戸数',N],['maisoku','マイソク価格（業者目線）',N],['tas','TAS',N]]],
  ['賃料・費用',[['sub','サブリース賃料',N],['shu','集金代行（実賃）',N],['mgmtFee','管理手数料',N],['mgmt','管理費',N],['repair','修繕費',N]]],
  ['融資条件',[['rate','金利（％）',PC],['yield','基準利回り（％）',PC],['offset','仕入れ上限＝評価−（円）',N]]],
  ['取扱条件の確認（条件書）',[['walk10','徒歩10分以上',SEL,['いいえ','はい']],['unit3','3点ユニット',SEL,['いいえ','はい']],['washer','洗濯機置場なし・室外',SEL,['いいえ','はい']]]]]
};
const NEWP={sim:{units:'',structure:'鉄筋コンクリート造',mgmtCo:'',mgmtMethod:'巡回',guarantee:'',remarks:'',tradeType:'（未選択）',showInternal:'載せない',addr:'',station:'',station2:'',sqm:'',floorsTotal:'',floor:'',layout:UNSEL,outCol:'①',priceOv:'',name:'新規物件',room:'',vendor:'',prop:'',base:30000,mode:'サブリース',rent:0,mgmt:0,repair:0,other:0,rate:0.02748,years:35,date:''},
 ion:{name:'新規物件',region:'東京',ekimei:'',area:'赤エリア',walk:'5分以内',sqm:'',built:'',units:'',cost:'',sub:'',shu:'',mgmt:'',repair:'',other:0,price:'',deposit:0,feeRate:0.05,y1:35,y2:45,r1:0.02376,r2:0.0228,r3:0.02532,r4:0.02532,rentBasis:'標準',feeMode:'標準',yieldOv:'',costOv:'',agentOv:''},
 sbj:{walk10:'いいえ',unit3:'いいえ',washer:'いいえ',name:'新規物件',region:'東京以外',sqm:'',built:'',units:'',maisoku:'',tas:'',sub:'',shu:'',mgmtFee:'',mgmt:'',repair:'',rate:0.0235,yield:0.04,offset:4000000}};

/* ---- 画面 ---- */
function head(){
  document.getElementById('tools').innerHTML=Object.keys(TOOLS).map(k=>`<button class="${S.tool===k?'on':''}" onclick="setTool('${k}')">${TOOLS[k]}</button>`).join('');
  document.getElementById('tabs').innerHTML=`<button class="${cur()==='list'?'on':''}" onclick="go('list')">一覧</button>`+
   L().map(p=>`<button class="${cur()===p.id?'on':''}" data-id="${p.id}" onclick="go('${p.id}')">${esc(p.name||'(無題)')}</button>`).join('')}
function setTool(t){S.tool=t;save();render()}
function go(id){S.cur[S.tool]=id;save();render()}
function render(){head();(cur()==='list'||!getP())?renderList():renderProp();save()}
function fieldHTML(p,f){const[k,l,t,o]=f;const v=p[k]??'';
  if(t===SEL){const opts=typeof o==='function'?o(p):o;return `<label><span>${l}</span><select data-k="${k}">${opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
  if(t===T)return `<label><span>${l}</span><input class="wide" data-k="${k}" value="${esc(v)}"${k==='ekimei'?' list="stlist" autocomplete="off"':''}></label>`;
  if(t===PC)return `<label><span>${l}</span><input type="number" inputmode="decimal" step="any" data-k="${k}" data-pct="1" value="${v===''?'':+(Number(v)*100).toFixed(8)}"></label>`;
  if(t===DT)return `<label><span>${l}</span><input type="date" data-k="${k}" value="${esc(v)}"></label>`;
  return `<label><span>${l}</span><input type="number" inputmode="decimal" step="any" data-k="${k}" value="${esc(v)}"></label>`}
function renderProp(){const p=getP();const g=SCHEMA[S.tool];
  const cards=g.map(([title,fs],i)=>`<div class="card"><h2>${title}</h2>${fs.map(f=>fieldHTML(p,f)).join('')}</div>`).join('');
  document.getElementById('main').innerHTML=`<div class="card" id="mscard" style="margin-bottom:16px"><h2>マイソクから自動入力</h2><div class="bar" style="margin:0"><button class="pri" onclick="document.getElementById('msf').click()">マイソクを選択（PDF・写真）</button>${S.tool==='sim'?'<button onclick="mkOpen()">マイソクを作成</button>':''}<input type="file" id="msf" accept="application/pdf,image/*" hidden><button onclick="msTextToggle()">ネットの情報を貼り付け</button><span id="mss" class="note" style="margin:0"></span></div><div id="mst" hidden style="margin-top:10px"><textarea id="msx" placeholder="不動産サイトの物件情報（物件名、所在地、駅、築年月、面積など）をコピーして、ここに貼り付けてください" style="height:140px"></textarea><div class="bar"><button class="pri" onclick="msReadText()">この文章から読み取る</button></div></div><div id="msr"></div></div><div class="grid">${cards}</div><div class="card sc" style="margin-top:16px"><h2>計算結果</h2><div id="res"></div></div>`;
  document.querySelectorAll('[data-k]').forEach(e=>e.addEventListener('change',()=>{ if(e.tagName==='SELECT'){p[e.dataset.k]=e.value;if(e.dataset.k==='region'&&S.tool==='ion'){p.area=(AREAS[p.region]||[''])[0];ionAutoArea(p)}
      if(e.dataset.k==='area'&&S.tool==='ion'&&nkSt(p.ekimei)){S.stArea=S.stArea||{};S.stArea[nkSt(p.ekimei)]=p.area}renderProp();head();save();} }));
  document.querySelectorAll('[data-k]').forEach(e=>{if(e.tagName==='INPUT')e.addEventListener('input',()=>{p[e.dataset.k]=e.type==='number'&&e.value!==''?(e.dataset.pct?Number(e.value)/100:Number(e.value)):e.value;
    if(e.dataset.k==='name'){const b=document.querySelector(`#tabs [data-id="${p.id}"]`);if(b)b.textContent=p.name||'(無題)'}
    if(S.tool==='ion'&&e.dataset.k==='ekimei'){const r=ionAutoArea(p);const sel=document.querySelector('[data-k=area]');if(sel&&r.area)sel.value=p.area;areaNote(p)}
    upd();save()})});
  if(S.tool==='ion'){const sel=document.querySelector('[data-k=area]');if(sel){sel.closest('label').insertAdjacentHTML('afterend','<div class="note" id="areanote" style="margin:0 0 6px"></div>');
    document.getElementById('main').insertAdjacentHTML('beforeend','<datalist id="stlist">'+Object.keys(window.ION_AREA_MAP||{}).map(k=>'<option value="'+k+'">').join('')+'</datalist>');areaNote(p)}}
  document.getElementById('msf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)msRead(f)};
  upd()}
function areaNote(p){const e=document.getElementById('areanote');if(!e)return;const r=ionAreaOf(p);
  e.innerHTML=!p.ekimei?'':r.area?`駅「${esc(p.ekimei)}」→ ${r.area}（${r.src==='地図'?'イオンの区分地図の色':'以前に手動で選んだ内容'}）`:`<span class="err">${esc(r.err||'')}</span>`}
function upd(){const p=getP();if(!p)return;document.getElementById('res').innerHTML=RES[S.tool](p)}

const RES={
 sim(p){const r=AxiaCalc.calc(p);
  const row=(l,f,c)=>`<tr><td>${l}</td>${r.cols.map(x=>`<td class="${c?cls(x[c]):''}">${f(x)}</td>`).join('')}</tr>`;
  const a=AxiaCalc.age(p.date);
  return `<table><thead><tr><th></th><th>①</th><th>②</th><th>③</th></tr></thead><tbody>`+
   row('収支',x=>F(x.income),'income')+row('ローン月返済',x=>F(x.loan))+row('販売金額（万円）',x=>`<span class="big">${F(x.price)}</span>`)+row('実質収支',x=>F(x.real),'real')+row('プロップ倍率',x=>D(x.mult,2))+row('幅（万円）',x=>F(x.width),'width')+
   `</tbody></table>${rkNote(p)}<div class="note">賃管手数料 ${F(r.G3)}円　費用合計 ${F(r.H3)}円　販売①−750万円：${F(r.c3)}円${p.date?'　築年数：'+a+(a==='新築'?'':'日'):''}</div>`},
 ion(p){const o=AxiaCalc2.ion(p);const y=o.y;
  let h=`<div class="bar" style="margin:0 0 8px">${pill(o.ok,'融資条件に該当','融資条件に該当しない')}<span class="note" style="margin:0">20㎡以上・築25年未満・20戸以上</span></div>`;
  h+=`<table><tbody><tr><td>築年数</td><td>${o.years==null?'':o.years+'年（'+F(o.days)+'日）'}</td></tr>`+
     `<tr><td>想定利回り</td><td>${y.rate?D(y.pct,2)+'%':`<span class="err">${esc(y.err||'')}　→「想定利回り」を手入力</span>`}</td></tr>`+
     `<tr><td>賃料（手取計算用）</td><td>${F(o.rent)}</td></tr><tr><td>手数料合計</td><td>${F(o.feeTotal)}（代行${F(o.agent)}＋管積${F(o.kanseki)}）</td></tr>`+
     `<tr><td>販売価格</td><td><span class="big">${o.price==null?'—':F(o.price)}</span></td></tr>`;
  if(o.price!=null)h+=`<tr><td>表面利回り / NET</td><td>${PCT(o.gross)} / ${PCT(o.net)}</td></tr><tr><td>物件幅（販売−仕入）</td><td>${F(o.width)}</td></tr><tr><td>融資金額 / 諸費用</td><td>${F(o.loan)} / ${F(o.cost)}</td></tr>`;
  h+=`</tbody></table>`;
  if(o.plans)h+=`<table style="margin-top:12px"><thead><tr><th>プラン</th><th>ローン金額</th><th>金利</th><th>収支</th></tr></thead><tbody>${o.plans.map(x=>`<tr><td>${x.label}</td><td>${F(x.amount)}</td><td>${PCT(x.rate,3)}</td><td class="${cls(x.income)}">${F(x.income)}</td></tr>`).join('')}</tbody></table>`;
  return h},

async function msBlobs(file,max){
  const cv=document.createElement('canvas'),out=[];
  const draw=async(src,w,h)=>{const k=Math.min(1,1800/Math.max(w,h));cv.width=Math.round(w*k);cv.height=Math.round(h*k);const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);await src(c,k);return new Promise(r=>cv.toBlob(r,'image/jpeg',0.88))};
  if(file.type==='application/pdf'){
    if(typeof pdfjsLib==='undefined')throw {code:'nopdf'};
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")'],{type:'text/javascript'}));
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    for(let i=1;i<=Math.min(pdf.numPages,max,2);i++){const pg=await pdf.getPage(i);const v=pg.getViewport({scale:1});const k=1800/Math.max(v.width,v.height);
      out.push(await draw(async c=>{await pg.render({canvasContext:c,viewport:pg.getViewport({scale:k})}).promise},v.width*k,v.height*k))}
  }else{const bmp=await createImageBitmap(file);out.push(await draw(async(c,k)=>c.drawImage(bmp,0,0,bmp.width*k,bmp.height*k),bmp.width,bmp.height))}
  return out}

  ws.getColumn(1).width=3.3;for(let k=2;k<=35;k++)ws.getColumn(k).width=3.7;ws.getColumn(36).width=3.3;for(let r=1;r<=36;r++)ws.getRow(r).height=16.5;

  const put=(r1,k1,r2,k2,v,o={})=>{if(r1!==r2||k1!==k2)ws.mergeCells(r1,k1,r2,k2);const x=cell(r1,k1);x.value=v;x.font={name:FN,size:o.size||11,bold:!!o.bold,color:o.color};x.alignment={vertical:o.v||'middle',horizontal:o.h,wrapText:o.nowrap?false:true,shrinkToFit:!!o.nowrap,textRotation:o.rot};if(o.fmt)x.numFmt=o.fmt;if(o.bg)fill(r1,k1,r2,k2,o.bg)};
  const bd=(r1,k1,r2,k2,side,st)=>{for(let r=r1;r<=r2;r++)for(let k=k1;k<=k2;k++){const b=Object.assign({},cell(r,k).border||{});if(side==='t'&&r===r1||side==='b'&&r===r2||side==='l'&&k===k1||side==='r'&&k===k2||side==='box'&&(r===r1||r===r2||k===k1||k===k2)){if(side==='box'){if(r===r1)b.top={style:st};if(r===r2)b.bottom={style:st};if(k===k1)b.left={style:st};if(k===k2)b.right={style:st}}else b[{t:'top',b:'bottom',l:'left',r:'right'}[side]]={style:st}}cell(r,k).border=b}};
  // ヘッダー帯
  fill(2,2,4,35,BLK);
  put(2,2,4,2,'価\n格',{bold:true,color:WHT,h:'center',bg:BLK,size:10});
  const pr=d.price===''?'':Number(String(d.price).replace(/,/g,''));
  put(2,3,4,7,pr,{bold:true,size:22,color:WHT,h:'left',bg:BLK,fmt:'#,##0'});put(3,8,4,9,'万円',{color:WHT,v:'bottom',bg:BLK,size:10});
  put(2,12,4,21,d.stations.join('\n'),{color:WHT,bg:BLK,size:11});
  put(2,22,4,35,d.name,{bold:true,size:mkFs(d.name,430,20)*0.75+4>20?20:Math.max(9,Math.round(mkFs(d.name,430,20)*0.9)),color:WHT,h:'right',bg:BLK,nowrap:true});
  // 右の表
  let r=6;const X=25,L1=26,L2=29,CO=30,V1=31,V2=35;
  d.rows.forEach(([lab,rs],si)=>{const isLast=lab==='備考',n=lab==='所在'?2:lab==='建物'?8:lab==='建物管理'?5:(31-r);const r0=r;
    put(r0,X,r0+n-1,X,lab,{bold:true,color:WHT,bg:BLK,h:'center',rot:'vertical',size:10});
    if(lab==='所在')put(r0,L1,r0+1,V2,rs[0][2],{bold:true,h:'left'});
    else{let rr=r0;rs.forEach(x=>{if(x[3]===2){const rest=r0+n-rr;put(rr,L1,rr+rest-1,V2,x[2],{v:'top',h:'left',size:10});rr+=rest}else{put(rr,L1,rr,L2,x[0],{h:'distributed'});put(rr,CO,rr,CO,'：',{h:'center'});put(rr,V1,rr,V2,x[2],{h:'left'});bd(rr,L1,rr,V2,'t','hair');rr++}})}
    if(si)bd(r0,X,r0,V2,'t','medium');r+=n});

  const slotBox={photo:[28,106,372,556],plan:[400,106,341,300],map:[400,414,341,248]};

  put(33,15,35,31,`${c.zip}\n${c.addr}\nＴＥＬ：${c.tel}　ＦＡＸ：${c.fax}`,{h:'left',size:10});
  bd(33,2,35,35,'box','medium');
  const lg=wb.addImage({base64:window.AXIA_LOGO.split(',')[1],extension:'png'});ws.addImage(lg,{tl:{col:32.2,row:32.1},ext:{width:58,height:58}});

async function mkExport(kind){const p=L().find(x=>x.id===MK.pid),m=document.getElementById('mkm');if(!p)return;
  const base='マイソク【楽天銀行】 提出用 '+((rkRow(p).C||'物件').replace(/[\\/:*?"<>|]/g,''));
  try{m.textContent='作成中…';let data,fn;
    if(kind==='xlsx'){if(typeof ExcelJS==='undefined')throw 0;data=await mkExcel(p);fn=base+'.xlsx'}
    else{if(typeof html2canvas==='undefined')throw 0;
      const host=document.createElement('div');host.style.cssText='position:fixed;left:-20000px;top:0';host.innerHTML=mkHTML(p,false);document.body.appendChild(host);
      const cv=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#fff',useCORS:true});host.remove();
      if(kind==='pdf'){if(typeof jspdf==='undefined')throw 0;const pdf=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,210);data=pdf.output('arraybuffer');fn=base+'.pdf'}
      else{data=await new Promise(r=>cv.toBlob(r,'image/png'));fn=base+'.png'}}
    const dl=typeof claude!=='undefined'?await claude.use('downloads').catch(()=>null):null;
    if(dl){await dl.save({filename:fn,data});m.textContent='保存を確認してください'}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=fn;a.click();m.textContent='保存しました'}
  }catch(e){m.textContent=e&&e.code==='cancelled'?'保存をやめました':'保存できませんでした。もう一度試してください'}}

function bulkOpen(){BQ.rows=[];BQ.created=null;
  document.getElementById('main').innerHTML=`<div class="bar" style="margin:0 0 12px"><button onclick="render()">← 戻る</button><span class="note" style="margin:0">複数のマイソク（PDF・写真）をまとめて選び、楽天・イオン・SBJの机上を一度に出します</span></div>

function bulkTable(){const t=document.getElementById('bkt');
  t.innerHTML=`<div class="sc"><table><thead><tr><th>追加</th><th>ファイル</th><th>状態</th>${BULK_FIELDS.map(f=>`<th>${f[1]}</th>`).join('')}</tr></thead><tbody>${BQ.rows.map((r,i)=>`<tr><td><input type="checkbox" ${r.use?'checked':''} ${r.E?'':'disabled'} onchange="BQ.rows[${i}].use=this.checked"></td><td class="nm" style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${esc(r.file.name)}</td><td>${esc(r.st)}</td>${BULK_FIELDS.map(f=>`<td>${r.E?`<input type="${f[2]}" ${f[2]==='number'?'step="any"':''} style="width:${f[3]}px;max-width:none;${f[2]==='text'?'text-align:left':''}" value="${esc(r.E[f[0]]??'')}" oninput="bulkSet(${i},'${f[0]}',this.value,${f[2]==='number'})">`:''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  document.getElementById('bkc').hidden=!BQ.rows.some(r=>r.E)}
function bulkSet(i,k,v,isNum){BQ.rows[i].E[k]=isNum?(v===''?null:Number(v)):v}
async function bulkRead(files){
  const m=document.getElementById('bkm'),stop=document.getElementById('bks');
  const sample=typeof claude!=='undefined'?await claude.use('sample').catch(()=>null):null;
  if(!sample){m.textContent='この機能は公開版のページでのみ使えます';return}
  const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images){m.textContent='この環境では画像の読み取りを使えません';return}
  const base=BQ.rows.length;files.forEach(f=>BQ.rows.push({file:f,st:'待機中',E:null,use:true}));bulkTable();
  BQ.stop=false;stop.hidden=false;let done=0;
  for(let i=base;i<BQ.rows.length;i++){if(BQ.stop){for(let j=i;j<BQ.rows.length;j++)BQ.rows[j].st='中止';break}
    const r=BQ.rows[i];r.st='読み取り中…';m.textContent=`読み取り中 ${done+1}/${files.length}（初回は許可の確認が出ます）`;bulkTable();
    try{const blobs=await msBlobs(r.file,lim.images.maxCount||2);r.E=await sample.json(MS_PROMPT,{images:blobs,modelTier:'default'});r.st=r.E.notes?'要確認':'完了'}
    catch(e){r.st=e&&e.code==='not_granted'?'許可なし':e&&e.code==='rate_limited'?'混雑（再試行を）':e&&e.code==='nopdf'?'PDF不可':'読み取れず';if(e&&(e.code==='not_granted'))BQ.stop=true}
    done++;bulkTable()}
  stop.hidden=true;m.textContent=`読み取り完了：${BQ.rows.filter(r=>r.E).length}件／${BQ.rows.length}件`}
const bkStn=(line,station,walk)=>{const st=station?String(station).replace(/駅$/,'')+'駅':'';const w=walk==null||walk===''?'':Number(walk);return [line,st&&(st+(w!==''&&!isNaN(w)?' 徒歩'+w+'分':''))].filter(Boolean).join(' / ')};
function bulkProp(bank,E,uid){

  const base=JSON.parse(JSON.stringify(NEWP[bank])),id='n'+uid+bank[0];
  if(bank==='sim')return Object.assign(base,{id,name:E.name||'',units:n(E.units),addr:E.address||'',station:bkStn(E.line,E.station,E.walkMin),station2:bkStn(E.line2,E.station2,E.walkMin2),sqm:n(E.sqm),floorsTotal:n(E.floorsTotal),floor:n(E.floor),layout:normLayout(E.layout)||UNSEL,structure:STRUCTS.includes(E.structure)?E.structure:UNSEL,mgmtMethod:METHODS.includes(E.mgmtMethod)?E.mgmtMethod:UNSEL,date,vendor:n(E.price),rent:n(E.rent)||0,mgmt:n(E.mgmt)||0,repair:n(E.repair)===''?0:n(E.repair)});
  if(bank==='ion'){const reg=(REGION_BY_PREF.find(x=>x[0].test(E.address||''))||[])[1]||'東京';const w=n(E.walkMin);const ek=[E.station,E.station2].find(x=>x&&(window.ION_AREA_MAP||{})[nkSt(x)])||E.station||'';
    const q=Object.assign(base,{id,name:E.name||'',region:reg,ekimei:String(ek).replace(/駅$/,''),area:(AREAS[reg]||[''])[0],walk:w!==''&&w>5?'6分以上':'5分以内',sqm:n(E.sqm),built:date,units:n(E.units),cost:n(E.price),shu:n(E.rent),mgmt:n(E.mgmt),repair:n(E.repair)});ionAutoArea(q);return q}
  return Object.assign(base,{id,name:E.name||'',sqm:n(E.sqm),built:date,units:n(E.units),maisoku:n(E.price),tas:n(E.tas),shu:n(E.rent),mgmtFee:'',mgmt:n(E.mgmt),repair:n(E.repair)})}
function bulkCreate(){
  const banks=[...document.querySelectorAll('.bkb:checked')].map(c=>c.value),rows=BQ.rows.filter(r=>r.use&&r.E);
  if(!banks.length||!rows.length){document.getElementById('bkr').innerHTML='<div class="err">追加する物件と銀行を選んでください</div>';return}
  const stamp=Date.now();const out=[];
  rows.forEach((r,i)=>{const o={name:r.E.name||r.file.name,items:{}};banks.forEach(b=>{const p=bulkProp(b,r.E,stamp+'_'+i);S.lists[b].push(p);o.items[b]=p});out.push(o);r.use=false;r.st='追加済み'});
  save();bulkTable();BQ.created=out;
  const sim=p=>{const c=AxiaCalc.calc(p).cols[0];return `販売${F(c.price)}万円 ／ 収支${F(c.real)}`};
  const ion=p=>{const o=AxiaCalc2.ion(p);return o.price==null?`<span class="err">${esc(o.y&&o.y.err||'算出不可')}</span>`:`${o.y.pct}% ／ 販売${F(o.price)}円 ／ 35年収支${F(o.plans[0].income)}`};
  const sbj=p=>{if(!Number(p.tas))return '<span class="err">TAS未入力（評価額を出せません）</span>';const r=AxiaCalc2.sbj(p);return `${r.ok?'100%':'90%'}融資 ／ 販売${F(r.sale)}円 ／ 収支${F(r.income)}`};
  const f={sim,ion,sbj};
  document.getElementById('bkr').innerHTML=`<div class="card sc"><h2>3. 机上の結果（${out.length}物件）</h2><table><thead><tr><th>物件</th>${banks.map(b=>`<th>${TOOLS[b]}</th>`).join('')}</tr></thead><tbody>${out.map(o=>`<tr><td class="nm">${esc(o.name)}</td>${banks.map(b=>`<td style="text-align:left"><a href="#" onclick="event.preventDefault();S.tool='${b}';go('${o.items[b].id}')" style="color:var(--pri)">${f[b](o.items[b])}</a></td>`).join('')}</tr>`).join('')}</tbody></table>
   <div class="note">結果の行をタップすると、その銀行の物件画面が開きます。イオンはエリア（仮：赤）、SBJはTAS未入力のため、必要に応じて直してください。</div></div>`}
/* ---- 端末をまたぐ同期（本人専用のデータベース。使えない環境では端末内のみ） ---- */
const setSync=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
function allDocs(){const o={};for(const t of Object.keys(S.lists))S.lists[t].forEach((p,i)=>{o[p.id]=JSON.parse(JSON.stringify({...p,tool:t,order:i}))});return o}
function schedSync(){if(!SYNC.col)return;const cur=allDocs();
  const same=Object.keys(cur).length===Object.keys(SYNC.last).length&&Object.keys(cur).every(id=>SYNC.last[id]===stable(cur[id]));
  if(same)return;clearTimeout(SYNC.timer);setSync('保存中…');SYNC.timer=setTimeout(flush,700)}
async function flush(){SYNC.timer=null;if(!SYNC.col)return;if(SYNC.busy){SYNC.timer=setTimeout(flush,500);return}
  SYNC.busy=true;
  try{const cur=allDocs();
    for(const id in cur){const js=stable(cur[id]);if(SYNC.last[id]!==js){await SYNC.col.doc(id).set(cur[id]);SYNC.last[id]=js}}
    for(const id of Object.keys(SYNC.last)){if(!cur[id]){await SYNC.col.doc(id).delete();for(const sl of ['photo','plan','map'])SYNC.col.doc('img_'+id+'_'+sl).delete().catch(()=>{});delete SYNC.last[id]}}
    setSync('同期済み')}
  catch(e){setSync('同期エラー（この端末には保存済み）')}
  SYNC.busy=false}
function applyRemote(docs){
  const lists={sim:[],ion:[],sbj:[]};
  docs.forEach(d=>{if(d.id.startsWith('img_'))return;const x={...d.data()};const t=x.tool;if(!lists[t])return;lists[t].push({...x,id:d.id})});
  for(const t in lists)lists[t].sort((a,b)=>(a.order||0)-(b.order||0)).forEach(p=>{delete p.tool;delete p.order});
  const rem={};docs.forEach(d=>{rem[d.id]=stable(d.data())});
  SYNC.last=rem;
  try{localStorage.setItem('axia-v2-backup',JSON.stringify(S.lists))}catch(e){}
  S.lists=lists;
  for(const t in S.cur)if(S.cur[t]!=='list'&&!lists[t].find(p=>p.id===S.cur[t]))S.cur[t]='list';
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  const a=document.activeElement;if(cur()==='list'||!a||a.tagName!=='INPUT')render();else head()}
async function startSync(){
  try{
    const user=await claude.use('user'),db=await claude.use('db');
    const uid=user&&await user.id();
    if(!db||!uid){setSync('端末内のみ保存（共有保存を利用できません）');return}
    const col=db.collection('data/users/'+uid);
    let first=true;const t=setTimeout(()=>setSync('接続中…（端末内のデータを表示中）'),10000);
    col.onSnapshot(async snap=>{
      if(snap.metadata.fromCache&&first&&snap.empty)return;
      clearTimeout(t);
      snap.docs.forEach(d=>{if(d.id.startsWith('img_')&&d.exists)IMG[d.id.slice(4)]=d.data().data});
      const docs=snap.docs.filter(d=>d.id!=='_meta'&&!d.id.startsWith('img_')&&d.exists);
      const hasMeta=snap.docs.some(d=>d.id==='_meta');
      if(first){first=false;
        if(!hasMeta&&!docs.length){await col.doc('_meta').set({v:1});SYNC.col=col;SYNC.last={};await flush();return}
        SYNC.col=col;applyRemote(docs);setSync('同期済み');return}
      if(SYNC.timer||SYNC.busy)return;
      const rem={};docs.forEach(d=>{rem[d.id]=stable(d.data())});
      const same=Object.keys(rem).length===Object.keys(SYNC.last).length&&Object.keys(rem).every(id=>SYNC.last[id]===rem[id]);
      if(!same){applyRemote(docs);setSync('同期済み')}
    },()=>setSync('同期エラー（この端末には保存済み）'));
  }catch(e){setSync('端末内のみ保存')}}
render();
startSync();
</script></body></html>
