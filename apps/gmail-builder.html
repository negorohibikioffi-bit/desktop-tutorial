<html lang="ja">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完了報告メール</title>
    <!-- ホーム画面に置いたときアプリとして開くための一式（相対パスでGitHub Pagesに対応） -->
    <link rel="manifest" href="Gmail_builder.webmanifest?v=2">
    <meta name="theme-color" content="#0a0e1a">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="gmail-builder/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="gmail-builder/icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
:root{--bg:#0a0e1a;--surface:rgba(255,255,255,.045);--border:rgba(255,255,255,.10);--text:#e8ecf8;--dim:#8791b0;--label:#a4adc8;--input:rgba(255,255,255,.05);--gold:#f0c869;--blue:#7aa2ff;--red:#ff6b70;--green:#10b981;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Segoe UI',sans-serif;color:var(--text);min-height:100vh;padding:20px 16px 110px;
background:radial-gradient(900px 500px at 10% -10%,rgba(99,102,241,.22),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(240,200,105,.10),transparent 60%),var(--bg);background-attachment:fixed}
.container{max-width:700px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
.header{position:relative;padding:26px 96px 22px;text-align:center;background:linear-gradient(135deg,rgba(240,200,105,.14),rgba(99,102,241,.10));border-bottom:1px solid var(--border)}
.header h1{font-size:24px;font-weight:900;letter-spacing:.08em;margin-bottom:6px;background:linear-gradient(90deg,#fff,#f0c869);-webkit-background-clip:text;background-clip:text;color:transparent}
.header p{font-size:13px;color:var(--dim)}
.header-logo{position:absolute;right:16px;top:50%;transform:translateY(-50%);height:56px;width:auto;filter:drop-shadow(0 0 8px rgba(240,200,105,.25))}
.form-section{padding:26px}
.form-group{margin-bottom:20px}
label{display:block;font-weight:700;margin-bottom:8px;color:var(--label);font-size:13px;letter-spacing:.03em}
select,input,textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);background:var(--input);transition:all .2s}
select option{background:#141a30;color:var(--text)}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.25)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);background:rgba(240,200,105,.06);box-shadow:0 0 0 3px rgba(240,200,105,.15)}
#sendTo{background:rgba(255,255,255,.03)!important;color:var(--dim)}
#remarks{border:1px solid var(--border)!important;background:var(--input)!important;color:var(--text)!important}
.required{color:var(--red)}
.action-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(10,14,26,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--border);box-shadow:0 -4px 24px rgba(0,0,0,.4);z-index:500}
.action-bar-inner{max-width:700px;margin:0 auto}
.action-bar .btn-gmail{width:100%;padding:16px;font-size:17px;letter-spacing:.1em}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.label-row label{margin-bottom:0}
.btn-gear{background:none;border:none;color:var(--blue);font-size:12px;font-weight:700;padding:4px 6px;cursor:pointer;flex-shrink:0}
.btn-gear:hover{text-decoration:underline}
.error-msg{display:none;color:var(--red);font-size:12px;font-weight:700;margin-top:6px}
.field-error .error-msg{display:block}
.field-error select,.field-error input,.field-error textarea{border-color:var(--red)!important;background:rgba(255,107,112,.10)!important}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.preview-head h3{color:var(--gold)!important;font-size:15px}
button{padding:14px 24px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
button:active{transform:scale(.98)}
.btn-gmail{background:linear-gradient(135deg,#dc2626,#ff5a5f);color:#fff;box-shadow:0 6px 20px rgba(234,67,53,.35)}
.btn-gmail:hover{box-shadow:0 8px 26px rgba(234,67,53,.55);transform:translateY(-1px)}
.preview-section{background:rgba(0,0,0,.18);padding:26px;border-top:1px solid var(--border);display:none}
.preview-section.active{display:block}
.preview-box{background:rgba(255,255,255,.04);padding:22px;border-radius:12px;border:1px solid rgba(240,200,105,.28);white-space:pre-wrap;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo UI",sans-serif;font-size:14px;line-height:1.8;max-height:500px;overflow-y:auto;font-weight:600;color:var(--text)}
.toast{position:fixed;top:20px;right:20px;background:var(--green);color:#fff;padding:16px 24px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;animation:slideIn .3s ease;z-index:1000}
.toast.active{display:block}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
.info-text{font-size:12px;color:var(--dim);margin-top:4px}
.btn-mini{background:linear-gradient(135deg,#3b6cf5,#6366f1);color:#fff;padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
.btn-mini.secondary{background:rgba(255,255,255,.10);color:var(--text)}
.save-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--label)}
.save-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);flex-shrink:0}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal-backdrop.active{display:flex}
.modal{background:#121830;border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-head{padding:16px;border-bottom:1px solid var(--border);font-weight:700;color:var(--gold)}
.modal-body{padding:16px;overflow-y:auto}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);text-align:right}
.modal-add{display:flex;gap:8px;margin-bottom:14px}
.modal-add input{flex:1;min-width:0;padding:10px 12px}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text)}
.add-row-group{margin-top:-12px}
.btn-add-row{padding:6px 14px;margin-top:8px;background:rgba(122,162,255,.12);border:1px solid rgba(122,162,255,.35);color:var(--blue);border-radius:999px;font-size:12px;font-weight:700}
.btn-add-row:hover{background:rgba(122,162,255,.22)}
.btn-row-del{background:none;border:none;color:var(--red);font-size:12px;font-weight:700;padding:4px 6px;cursor:pointer;flex-shrink:0}
.sub-input{margin-top:8px}
.btn-del{background:rgba(255,107,112,.18);color:var(--red);border:1px solid rgba(255,107,112,.4);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700;flex-shrink:0}
@media(max-width:480px){.header{padding:22px 76px 18px}.header h1{font-size:20px}.header-logo{height:44px;right:12px}.form-section{padding:20px 16px}}
</style>
</head>

        // 旧バージョンのリストを引き継ぐ
        function migrateOldStorage() {
            try {
                migrateProperties();
                migrateBanks();
                renameSavedProperties();
            } catch (e) {
                console.error('リスト移行エラー:', e);
            }
        }

        // 物件：初期値は新しいものに入れ替え、自分で追加した分だけ残す
        function migrateProperties() {
            if (localStorage.getItem(LIST_DEFS.property.key)) return;

            let inherited = null;
            const saved = localStorage.getItem('propertyList_v2');
            if (saved) {
                inherited = JSON.parse(saved);
            } else {
                const oldest = localStorage.getItem('customProperties');
                if (oldest) inherited = JSON.parse(oldest);
            }
            if (!Array.isArray(inherited) || inherited.length === 0) return;

            const merged = DEFAULT_PROPERTIES.slice();
            inherited.forEach(function(name) {
                if (OLD_DEFAULT_PROPERTIES.indexOf(name) !== -1) return;
                if (merged.indexOf(name) === -1) merged.push(name);
            });
            localStorage.setItem(LIST_DEFS.property.key, JSON.stringify(merged));
        }

        // 物件：保存済みリストの旧名称を新名称に読み替える
        function renameSavedProperties() {
            const saved = localStorage.getItem(LIST_DEFS.property.key);
            if (!saved) return;
            const arr = JSON.parse(saved);
            if (!Array.isArray(arr)) return;

            const renamed = [];
            arr.forEach(function(name) {
                const fixed = PROPERTY_RENAMES[name] || name;
                if (renamed.indexOf(fixed) === -1) renamed.push(fixed);
            });
            if (JSON.stringify(renamed) !== saved) {
                localStorage.setItem(LIST_DEFS.property.key, JSON.stringify(renamed));
            }
        }

        // 銀行：改称した名前に読み替えて引き継ぐ
        function migrateBanks() {
            if (localStorage.getItem(LIST_DEFS.bank.key)) return;

            const saved = localStorage.getItem('bankList_v2');
            if (!saved) return;

            const oldArray = JSON.parse(saved);
            if (!Array.isArray(oldArray) || oldArray.length === 0) return;

            const renamed = [];
            oldArray.forEach(function(name) {
                const fixed = BANK_RENAMES[name] || name;
                if (renamed.indexOf(fixed) === -1) renamed.push(fixed);
            });
            localStorage.setItem(LIST_DEFS.bank.key, JSON.stringify(renamed));
        }

        // リスト取得（保存が無ければ初期値）
        function getList(type) {
            const def = LIST_DEFS[type];
            try {
                const saved = localStorage.getItem(def.key);
                if (saved) {
                    const arr = JSON.parse(saved);
                    if (Array.isArray(arr) && arr.length > 0) return arr;
                }
            } catch (e) {
                console.error('リスト読み込みエラー:', e);
            }
            return def.defaults.slice();
        }

        // リスト保存＋ドロップダウン再描画
        function setList(type, arr) {
            const def = LIST_DEFS[type];
            try {
                localStorage.setItem(def.key, JSON.stringify(arr));
            } catch (e) {
                console.error('リスト保存エラー:', e);
            }
            def.render();
        }

        // リストに1件追加（既存なら false）
        function addToList(type, name) {
            const arr = getList(type);
            if (arr.indexOf(name) !== -1) return false;
            arr.push(name);
            setList(type, arr);
            return true;
        }

        // セレクトを組み立て直す（選択中の値はできるだけ維持）
        function fillSelect(selectId, items, options) {
            fillSelectEl(document.getElementById(selectId), items, options);
        }

        function fillSelectEl(select, items, options) {
            if (!select) return;
            const current = select.value;
            const opts = options || {};

            select.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '選択してください';
            select.appendChild(placeholder);

            if (opts.undecided) {
                const undecided = document.createElement('option');
                undecided.value = '未定';
                undecided.textContent = '未定';
                select.appendChild(undecided);
            }

            items.forEach(function(name) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });

            if (opts.custom) {
                const other = document.createElement('option');
                other.value = 'その他';
                other.textContent = '✏️ その他（手入力）';
                select.appendChild(other);
            }

            select.value = current;
            if (select.value !== current) select.value = '';
        }

        function renderPropertySelects() {
            const items = getList('property');
            Array.prototype.forEach.call(document.querySelectorAll('.js-property-select'), function(select) {
                fillSelectEl(select, items, { undecided: true, custom: true });
            });
            fillSelect('beforePropertyName', items, { undecided: true, custom: true });
        }

        function renderBankSelect() {
            fillSelect('bank', getList('bank'), { undecided: true, custom: true });
        }

        function renderStaffSelects() {
            const items = getList('staff');
            fillSelect('personInCharge', items, {});
            Array.prototype.forEach.call(document.querySelectorAll('.js-accompany-select'), function(select) {
                fillSelectEl(select, items, {});
            });
        }

        }

        // ========== 物件の追加行（2件目以降は物件名＋号室でセット） ==========
        function addPropertyRow() {
            const wrap = document.createElement('div');
            wrap.className = 'form-group extra-property';

            const labelRow = document.createElement('div');
            labelRow.className = 'label-row';
            const label = document.createElement('label');
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'btn-row-del';
            del.textContent = '✕ 削除';
            del.addEventListener('click', function() {
                wrap.remove();
                renumberPropertyRows();
                updateSubject();
            });
            labelRow.appendChild(label);
            labelRow.appendChild(del);

            const select = document.createElement('select');
            select.className = 'js-property-select extra-prop-select';

            const custom = document.createElement('input');
            custom.type = 'text';
            custom.className = 'sub-input extra-prop-custom';
            custom.placeholder = '物件名を入力してください';
            custom.style.display = 'none';

            const room = document.createElement('input');
            room.type = 'text';
            room.className = 'sub-input extra-prop-room';
            room.placeholder = '号室（例：203号室）';

            select.addEventListener('change', function() {
                if (select.value === 'その他') {
                    custom.style.display = 'block';
                } else {
                    custom.style.display = 'none';
                    custom.value = '';
                }
                updateSubject();
            });
            custom.addEventListener('input', updateSubject);
            room.addEventListener('input', updateSubject);

            wrap.appendChild(labelRow);
            wrap.appendChild(select);
            wrap.appendChild(custom);
            wrap.appendChild(room);
            document.getElementById('extraProperties').appendChild(wrap);

            fillSelectEl(select, getList('property'), { undecided: true, custom: true });
            renumberPropertyRows();
            updateSubject();

        function renumberPropertyRows() {
            Array.prototype.forEach.call(document.querySelectorAll('.extra-property'), function(row, i) {
                row.querySelector('label').textContent = '物件名（' + (i + 2) + '件目）';
            });
        }

        // 入力されている物件を上から順に集める（失敗時は null）
        function collectProperties(report) {
            const list = [];

            const first = document.getElementById('propertyName').value;
            const firstCustom = document.getElementById('customProperty').value.trim();
            const firstRoom = document.getElementById('roomNumber').value.trim();

            if (report) {
                if (!first) {
                    showFieldError('propertyName', '物件名を選んでください');
                    return null;
                }
                if (first === 'その他' && !firstCustom) {
                    showFieldError('customProperty', '物件名を入力してください');
                    return null;
                }
            }

            if (first) {
                list.push({ name: first === 'その他' ? firstCustom : first, room: firstRoom });
            }

            const rows = document.querySelectorAll('.extra-property');
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const select = row.querySelector('.extra-prop-select');
                const custom = row.querySelector('.extra-prop-custom').value.trim();
                const room = row.querySelector('.extra-prop-room').value.trim();

                if (!select.value || (select.value === 'その他' && !custom)) {
                    if (report) {
                        showRowError(row, select, (i + 2) + '件目の物件名を入力してください');
                        return null;
                    }
                    continue;
                }
                list.push({ name: select.value === 'その他' ? custom : select.value, room: room });
            }

            return list;
        }

        // 追加行用の赤字エラー
        function showRowError(row, focusEl, message) {
            let msg = row.querySelector('.error-msg');
            if (!msg) {
                msg = document.createElement('div');
                msg.className = 'error-msg';
                row.appendChild(msg);
            }
            msg.textContent = message;
            row.classList.add('field-error');
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            try {
                focusEl.focus({ preventScroll: true });
            } catch (e) {
                focusEl.focus();
            }
        }

        // 物件を1行の文字列にする（1件のときは号室を別行に出すので名前だけ）
        function formatProperties(list) {
            return list.map(function(p) {
                return p.room ? p.name + ' ' + p.room : p.name;
            }).join('／');
        }

        // ========== リスト編集モーダル ==========
        let currentListType = null;

        function openListModal(type) {
            currentListType = type;
            const def = LIST_DEFS[type];
            document.getElementById('listModalTitle').textContent = def.label + 'の編集';
            const input = document.getElementById('listModalInput');
            input.value = '';
            input.placeholder = def.placeholder;
            renderListModalItems();
            document.getElementById('listModal').classList.add('active');
        }

        function closeListModal() {
            document.getElementById('listModal').classList.remove('active');
            currentListType = null;
        }

        function renderListModalItems() {
            const box = document.getElementById('listModalItems');
            box.innerHTML = '';
            const items = getList(currentListType);

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'info-text';
                empty.textContent = '項目がありません';
                box.appendChild(empty);
                return;
            }

            items.forEach(function(name) {
                const row = document.createElement('div');
                row.className = 'list-item';

                const label = document.createElement('span');
                label.textContent = name;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn-del';
                btn.textContent = '削除';
                btn.addEventListener('click', function() {
                    if (!confirm('「' + name + '」をリストから削除しますか？')) return;
                    const arr = getList(currentListType);
                    const index = arr.indexOf(name);
                    if (index !== -1) arr.splice(index, 1);
                    setList(currentListType, arr);
                    renderListModalItems();
                    updateSubject();
                    showToast('「' + name + '」を削除しました', 'success');
                });

                row.appendChild(label);
                row.appendChild(btn);
                box.appendChild(row);
            });
        }

        function addFromListModal() {
            const input = document.getElementById('listModalInput');
            const name = input.value.trim();

            if (!name) {
                alert('追加する内容を入力してください');
                return;
            }
            if (!addToList(currentListType, name)) {
                alert('「' + name + '」はすでにリストにあります');
                return;
            }

            input.value = '';
            renderListModalItems();
            showToast('「' + name + '」を追加しました', 'success');
        }

        // 件名自動更新
        function updateSubject() {
            const reportType = document.getElementById('reportType').value;
            const subjectPreview = document.getElementById('subjectPreview');

            if (!reportType) {
                subjectPreview.value = '';
                return;
            }

            const properties = collectProperties(false) || [];

            let subject = '【' + reportType + '】';
            if (properties.length > 0) {
                subject += formatProperties(properties);
            }

            subjectPreview.value = subject;
        }

        document.getElementById('reportType').addEventListener('change', function() {
            updateSubject();
            toggleBeforePropertyField();

        function toggleFieldsByReportType() {
            const reportType = document.getElementById('reportType').value;
            const isOpen = reportType === 'オープン';
            const isContract = reportType === '契約';

            document.getElementById('categoryGroup').style.display = isOpen ? 'none' : 'block';
            document.getElementById('bankGroup').style.display = isOpen ? 'none' : 'block';
            document.getElementById('contractDateGroup').style.display = isOpen ? 'none' : 'block';
            document.getElementById('bringInDateGroup').style.display = isOpen ? 'none' : 'block';
            document.getElementById('settlementDateGroup').style.display = isOpen ? 'none' : 'block';
            document.getElementById('attendeeGroup').style.display = isContract ? 'block' : 'none';

            // 銀行を隠すときは手入力欄も閉じる
            if (isOpen) {
                document.getElementById('customBankGroup').style.display = 'none';
            } else if (document.getElementById('bank').value === 'その他') {
                document.getElementById('customBankGroup').style.display = 'block';

        // ========== 未入力の案内（その場に赤字で表示） ==========
        function showFieldError(elementId, message) {
            const el = document.getElementById(elementId);
            const group = el.closest('.form-group');
            if (!group) {
                alert(message);
                return false;
            }

            let msg = group.querySelector('.error-msg');
            if (!msg) {
                msg = document.createElement('div');
                msg.className = 'error-msg';
                group.appendChild(msg);
            }
            msg.textContent = message;
            group.classList.add('field-error');
            group.scrollIntoView({ behavior: 'smooth', block: 'center' });

            try {
                el.focus({ preventScroll: true });
            } catch (e) {
                el.focus();
            }
            return false;
        }

        function clearFieldErrors() {
            Array.prototype.forEach.call(document.querySelectorAll('.field-error'), function(group) {
                group.classList.remove('field-error');
            });
        }

        // 入力し直したらその欄の赤表示を消す
        function clearErrorOnEdit(e) {
            if (!e.target || !e.target.closest) return;
            const group = e.target.closest('.form-group.field-error');
            if (group) group.classList.remove('field-error');
        }
        document.addEventListener('input', clearErrorOnEdit);
        document.addEventListener('change', clearErrorOnEdit);

        // ========== 担当・所属を記憶 ==========
        function rememberSelection(elementId, storageKey) {
            const select = document.getElementById(elementId);
            select.addEventListener('change', function() {
                try {
                    localStorage.setItem(storageKey, this.value);
                } catch (err) {
                    console.error('選択の保存エラー:', err);
                }
            });
        }

        function restoreSelection(elementId, storageKey) {
            try {
                const value = localStorage.getItem(storageKey);
                if (!value) return;
                const select = document.getElementById(elementId);
                select.value = value;
                if (select.value !== value) select.value = '';
            } catch (err) {
                console.error('選択の復元エラー:', err);
            }
        }

        rememberSelection('personInCharge', 'lastPersonInCharge');
        rememberSelection('accompany', 'lastAccompany');
        rememberSelection('department', 'lastDepartment');

        // 手入力欄の内容をリストへ追加し、その項目を選択状態にする
        function saveCustomEntryIfRequested(listType, selectId, inputId, groupId, checkboxId) {
            const select = document.getElementById(selectId);
            const checkbox = document.getElementById(checkboxId);

            if (select.value !== 'その他' || !checkbox.checked) return;

            const name = document.getElementById(inputId).value.trim();
            if (!name) return;

            const added = addToList(listType, name);

            // 追加した項目を選択状態にして手入力欄を閉じる
            select.value = name;
            document.getElementById(groupId).style.display = 'none';
            document.getElementById(inputId).value = '';
            checkbox.checked = false;

            if (added) {
                showToast('「' + name + '」をリストに追加しました', 'success');
            }
        }

        // 生成処理（成功=true／未入力=false）
        function generateReport() {
            clearFieldErrors();

            const reportType = document.getElementById('reportType').value;
            const category = document.getElementById('category').value;
            const customerName = document.getElementById('customerName').value.trim();
            const beforePropertyName = document.getElementById('beforePropertyName').value;
            const customBeforeProperty = document.getElementById('customBeforeProperty').value.trim();
            const beforeRoomNumber = document.getElementById('beforeRoomNumber').value.trim();
            const propertyName = document.getElementById('propertyName').value;
            const customProperty = document.getElementById('customProperty').value.trim();
            const roomNumber = document.getElementById('roomNumber').value.trim();
            const bank = document.getElementById('bank').value;
            const customBank = document.getElementById('customBank').value.trim();
            const contractDate = document.getElementById('contractDate').value;
            const bringInDate = document.getElementById('bringInDate').value;
            const settlementDate = document.getElementById('settlementDate').value;
            const personInCharge = document.getElementById('personInCharge').value;
            const accompanyList = collectAccompany();
            const department = document.getElementById('department').value;
            const attendee = document.getElementById('attendee').value;
            const remarks = document.getElementById('remarks').value.trim();
            const subject = document.getElementById('subjectPreview').value;

            // 必須チェック
            if (!reportType) {
                return showFieldError('reportType', '種別を選んでください');
            }
            const isOpen = reportType === 'オープン';
            const isContract = reportType === '契約';

            if (!isOpen && !category) {
                return showFieldError('category', '区分を選んでください');
            }
            if (!customerName) {
                return showFieldError('customerName', '顧客名を入力してください');
            }
            
            // 物件振替の場合は振替前物件名もチェック
            if (reportType === '物件振替') {
                if (!beforePropertyName) {
                    return showFieldError('beforePropertyName', '振替前の物件名を選んでください');
                }
                if (beforePropertyName === 'その他' && !customBeforeProperty) {
                    return showFieldError('customBeforeProperty', '振替前の物件名を入力してください');
                }
            }
            
            const properties = collectProperties(true);
            if (!properties) {
                return false;
            }
            if (!isOpen && !bank) {
                return showFieldError('bank', '銀行を選んでください');
            }
            if (!isOpen && bank === 'その他' && !customBank) {
                return showFieldError('customBank', '銀行名を入力してください');
            }
            if (!personInCharge) {
                return showFieldError('personInCharge', '担当を選んでください');
            }

            // 値の確定
            const finalBeforePropertyName = beforePropertyName === 'その他' ? customBeforeProperty : beforePropertyName;
            const finalBank = bank === 'その他' ? customBank : bank;
            const finalCustomerName = customerName.endsWith('様') ? customerName : customerName + '様';

            // 日付フォーマット（月・日・曜日のみ）
            let formattedContractDate = '';
            if (contractDate) {
                const date = new Date(contractDate);
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
                const weekday = weekdays[date.getDay()];
                formattedContractDate = month + '月' + day + '日（' + weekday + '）';
            }

            let formattedBringInDate = '';
            if (bringInDate) {
                const date = new Date(bringInDate);
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
                const weekday = weekdays[date.getDay()];
                formattedBringInDate = month + '月' + day + '日（' + weekday + '）';
            }

            let formattedSettlementDate = '';
            if (settlementDate) {
                const date = new Date(settlementDate);
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
                const weekday = weekdays[date.getDay()];
                formattedSettlementDate = month + '月' + day + '日（' + weekday + '）';
            }

            // メール本文生成（シンプル版）
            // 【種別】はSlack連携（GAS）が申込／オープンの判定に使うので必ず出す。
            // オープンのときは【区分】だけ省く。
            let report = '【種別】' + reportType + '\n';
            if (!isOpen) {
                report += '【区分】' + category + '\n';
            }
            report += '【顧客名】' + finalCustomerName + '\n';
            
            // 物件振替の場合は振替前を追加（物件名 + 号室）
            if (reportType === '物件振替' && finalBeforePropertyName) {
                let beforeInfo = finalBeforePropertyName;
                if (beforeRoomNumber) {
                    beforeInfo += ' ' + beforeRoomNumber;
                }
                report += '【振替前】' + beforeInfo + '\n';
            }
            
            // 1件なら今まで通り物件名と号室を分けて、2件以上なら【物件名】に「物件名 号室」でまとめる
            if (properties.length === 1) {
                report += '【物件名】' + properties[0].name + '\n';
                report += '【号室】' + (roomNumber || '－') + '\n';
            } else {
                report += '【物件名】' + formatProperties(properties) + '\n';
            }
            if (!isOpen) {
                report += '【銀行】' + finalBank + '\n';
            }
            if (!isOpen) {
                report += '【持込予定】' + (formattedBringInDate || '－') + '\n';
                report += '【契約予定】' + (formattedContractDate || '－') + '\n';
                report += '【決済予定】' + (formattedSettlementDate || '－') + '\n';
            }
            report += '【担当】' + (personInCharge || '－') + '\n';
            report += '【同行】' + (accompanyList.length ? accompanyList.join('、') : '－') + '\n';
            report += '【所属】' + (department || '－');
            if (isContract) {
                report += '\n【立会】' + (attendee || '－');
            }
            
            // 備考欄がある場合のみ追加
            if (remarks) {
                report += '\n【備考】' + remarks;
            }

            document.getElementById('previewBox').textContent = report;
            document.getElementById('previewSection').classList.add('active');
            document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });

            // 手入力した内容を、チェックが入っていればリストへ保存
            saveCustomEntryIfRequested('property', 'propertyName', 'customProperty', 'customPropertyGroup', 'savePropertyToList');
            saveCustomEntryIfRequested('bank', 'bank', 'customBank', 'customBankGroup', 'saveBankToList');

            updateSubject();

            return true;
        }

        // コピーボタン
        document.getElementById('btnCopy').addEventListener('click', function() {
            const previewBox = document.getElementById('previewBox');
            const text = previewBox.textContent;
            
            if (!text || text.trim() === '') {
                showToast('先に「Gmail送信」を押してください', 'error');
                return;
            }
            
            // テキストエリアを使った確実なコピー方法
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.width = '2em';
            textarea.style.height = '2em';
            textarea.style.padding = '0';
            textarea.style.border = 'none';
            textarea.style.outline = 'none';
            textarea.style.boxShadow = 'none';
            textarea.style.background = 'transparent';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('コピーしました！', 'success');
                } else {
                    showToast('コピーに失敗しました。プレビューを長押ししてコピーしてください。', 'error');
                }
            } catch (err) {
                console.error('コピーエラー:', err);
                showToast('コピーに失敗しました。プレビューを長押ししてコピーしてください。', 'error');
            }
            
            document.body.removeChild(textarea);
        });

        // クリップボードへコピー（トースト表示なし・保険用）
        function copyToClipboard(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.width = '2em';
                ta.style.height = '2em';
                ta.style.padding = '0';
                ta.style.border = 'none';
                ta.style.outline = 'none';
                ta.style.boxShadow = 'none';
                ta.style.background = 'transparent';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (err) {
                console.error('コピーエラー:', err);
                return false;
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            
            if (type === 'error') {
                toast.style.background = '#ef4444';
            } else {
                toast.style.background = '#10b981';
            }
            
            toast.classList.add('active');
            setTimeout(function() {
                toast.classList.remove('active');
            }, 3000);
        }

        // iPhone / iPad かどうか（iPadOSはUserAgentがMacintoshになる）
        function isIOSDevice() {
            const ua = navigator.userAgent;
            if (/iPhone|iPad|iPod/i.test(ua)) return true;
            return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
        }

        function isAndroidDevice() {
            return /Android/i.test(navigator.userAgent);
        }

        // アプリ用のURLを開き、アプリが立ち上がらなければ指定のURLへ切り替える
        function openAppThenFallback(appUrl, fallbackUrl) {
            let left = false;
            const onHide = function() { if (document.hidden) left = true; };
            document.addEventListener('visibilitychange', onHide);
            window.addEventListener('pagehide', function() { left = true; });

            window.location.href = appUrl;

            setTimeout(function() {
                document.removeEventListener('visibilitychange', onHide);
                if (!left && !document.hidden) {
                    window.location.href = fallbackUrl;
                }
            }, 1500);
        }

        // Gmail送信ボタン（生成 → コピー → Gmail起動 を一括）
        document.getElementById('btnGmail').addEventListener('click', function() {
            // 1) まず生成（未入力があればここで中断）
            if (!generateReport()) {
                return;
            }

            updateSubject();

            const emailBody = document.getElementById('previewBox').textContent;
            const subject = document.getElementById('subjectPreview').value;

            if (!subject || subject.trim() === '') {
                showToast('件名を作れませんでした。種別を選び直してください', 'error');
                return;
            }

            // 2) 本文をクリップボードへコピー
            const copied = copyToClipboard(emailBody);

            const TO = 'axia-japan@googlegroups.com';
            const encodedSubject = encodeURIComponent(subject);
            const encodedBody = encodeURIComponent(emailBody);
            const gmailWebUrl = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(TO) +
                '&su=' + encodedSubject + '&body=' + encodedBody;

            // GmailのWeb版を開く（Androidでは端末のGmailアプリがこのURLを拾う）
            function openGmailWeb() {
                const win = window.open(gmailWebUrl, '_blank');
                if (!win) window.location.href = gmailWebUrl;
            }

            // 3) Gmailを開く
            if (isIOSDevice()) {
                // googlegmail:// はiOS専用のスキーム。
                // これを使わないと既定メール（iCloud）が開いてしまう。
                const gmailAppUrl = 'googlegmail:///co?to=' + encodeURIComponent(TO) +
                    '&subject=' + encodedSubject + '&body=' + encodedBody;
                openAppThenFallback(gmailAppUrl, gmailWebUrl);

            } else if (isAndroidDevice()) {
                // Androidは mailto: で既定のメールアプリ（通常はGmail）が開く。
                // 件名だけでなく本文も渡すことで、開いた時点で全部入った状態になる。
                const mailtoUrl = 'mailto:' + TO +
                    '?subject=' + encodedSubject + '&body=' + encodedBody;
                openAppThenFallback(mailtoUrl, gmailWebUrl);

            } else {
                openGmailWeb();
            }

            showToast(copied ? '生成＋コピー完了。Gmailを開きます' : '生成完了。Gmailを開きます', 'success');
        });
    </script>
<!-- ホーム画面へのインストール
     Androidの Chrome は、同じサイト（iety0214-hub.github.io）のアプリが1つでも入っていると
     メニューの「ホーム画面に追加」で「すでにインストールされています」と出て入れられない。
     ページから直接インストールの画面を出せば、アプリごとに入れられる。
     iPhone / iPad はSafariの「ホーム画面に追加」を案内する。 -->
<div id="pwaInstallBar" style="display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top, 0px));z-index:3000;background:#1e2a4a;color:#fff;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.28);padding:6px 6px 6px 16px;font-size:14px;font-weight:700;align-items:center;gap:8px;white-space:nowrap;max-width:calc(100vw - 24px);">
  <span>📲 アプリとして追加</span>
  <button type="button" id="pwaInstallBtn" style="border:none;border-radius:999px;background:#fff;color:#1e2a4a;font-size:14px;font-weight:700;padding:8px 16px;cursor:pointer;">追加</button>
  <button type="button" id="pwaInstallClose" aria-label="閉じる" style="border:none;background:transparent;color:#fff;font-size:16px;padding:6px 10px;cursor:pointer;">✕</button>
</div>
<script>
(function () {
  var deferred = null;
  var bar = document.getElementById('pwaInstallBar');
  function hide() { bar.style.display = 'none'; }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    // PCでは出さない（スマホ・タブレットだけ）
    if (!/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)) return;
    try { if (sessionStorage.getItem('pwaInstallClosed')) return; } catch (err) {}
    bar.style.display = 'flex';
  });
  document.getElementById('pwaInstallBtn').addEventListener('click', function () {
    if (!deferred) return;
    hide();
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; }, function () { deferred = null; });
  });
  document.getElementById('pwaInstallClose').addEventListener('click', function () {
    hide();
    try { sessionStorage.setItem('pwaInstallClosed', '1'); } catch (err) {}
  });
  window.addEventListener('appinstalled', function () { hide(); deferred = null; });

  // iPhone / iPad はページからインストール画面を出せないので、Safariでの追加方法を案内する
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (isIOS && !standalone) {
    var key = 'iosA2hsClosed:' + location.pathname;
    var closed = false;
    try { closed = !!localStorage.getItem(key); } catch (err) {}
    if (!closed) {
      var ios = document.createElement('div');
      ios.id = 'pwaIosBar';
      ios.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top, 0px));z-index:3000;background:#1e2a4a;color:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.28);padding:10px 8px 10px 14px;font-size:13px;font-weight:600;line-height:1.5;display:flex;align-items:center;gap:8px;';
      var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Line\//.test(ua);
      ios.innerHTML = '<span style="flex:1;">📲 アプリとして追加するには<br>' +
        (isSafari ? '共有ボタン（□↑）、または右下の「…」→「共有」→「ホーム画面に追加」（「Webアプリとして開く」はオンのまま）' : 'Safariでこのページを開き、共有ボタン（□↑）、または右下の「…」→「共有」→「ホーム画面に追加」') +
        '</span><button type="button" aria-label="閉じる" style="border:none;background:transparent;color:#fff;font-size:16px;padding:6px 10px;cursor:pointer;">✕</button>';
      ios.querySelector('button').addEventListener('click', function () {
        ios.remove();
        try { localStorage.setItem(key, '1'); } catch (err) {}
      });
      document.body.appendChild(ios);
    }
  }
})();
</script>
